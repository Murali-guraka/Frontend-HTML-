<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            table {
                border-collapse: collapse;
                width: 70%;
            }
            th, td {
                border: 1px solid rgb(54, 15, 180);
                padding: 8px;
                text-align: left;
            }
            th {
                background-color:rgb(29, 213, 78);
            }
        </style>


<body>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>John Doe</td>
                <td>Computer Science</td>
                <td>85</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Jane Smith</td>
                <td>Mathematics</td>
                <td>90</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Bob Johnson</td>
                <td>Physics</td>
                <td>78</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Average Marks</td>
                <td>84.33</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
